# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  site-lint:
    name: Site lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: site/package-lock.json
    - name: Install site dependencies
      run: npm ci
      working-directory: site
    - name: Lint site sources and documentation
      run: npm run lint
      working-directory: site
    - name: Test site lint rules
      run: npm run test:lint
      working-directory: site

  detekt:
    name: Detekt
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: true
    - name: Run detekt and rule tests
      run: ./gradlew detekt :detekt-rules:test

  build:
    name: ${{ matrix.target }} (${{ matrix.kind }})
    strategy:
      matrix:
        include:
          - target: :gradle-plugin:test
            kind: test
            os: ubuntu-latest
            extra_args: ""
          - target: :gradle-plugin:validatePlugins
            kind: test
            os: ubuntu-latest
            extra_args: ""
          - target: :gradle-plugin:checkPublicApiDocs
            kind: docs
            os: ubuntu-latest
            extra_args: "--no-configuration-cache"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: true
    - name: Build with Gradle
      run: ./gradlew ${{ matrix.target }} ${{ matrix.extra_args }}
    - name: Upload coverage to Codecov
      if: matrix.target == ':gradle-plugin:test'
      uses: codecov/codecov-action@v7
      with:
        files: ./gradle-plugin/build/reports/jacoco/test/jacocoTestReport.xml
        fail_ci_if_error: true
        flags: gradle-plugin
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
